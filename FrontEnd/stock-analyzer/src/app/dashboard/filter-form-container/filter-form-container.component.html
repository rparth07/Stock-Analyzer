<div class="dialog-backdrop" (keydown.escape)="closeModal()"><section class="research-dialog" role="dialog" aria-modal="true" aria-labelledby="create-filter-title" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
<header class="dialog-header"><div><p class="eyebrow">Build your shortlist</p><h2 id="create-filter-title">Create a research filter</h2><p>Choose the trend to study. Combine criteria for a more focused shortlist.</p></div><button type="button" class="dialog-close" aria-label="Close filter dialog" (click)="closeModal()" [disabled]="isLoading">&times;</button></header>
<form [formGroup]="filterGroup" (ngSubmit)="submitForm()" [attr.aria-busy]="isLoading"><p #errorSummary tabindex="-1" *ngIf="errorMessage" role="alert" class="form-error">{{errorMessage}}</p>
<div class="dialog-fields"><div><label class="ui-label" for="FilterName">Filter name</label><input id="FilterName" class="ui-input" formControlName="FilterName" placeholder="e.g. Rising close prices" maxlength="80"><p *ngIf="filterGroup.get('FilterName')?.touched && filterGroup.get('FilterName')?.invalid" class="field-error">Enter a name, up to 80 characters.</p></div><div><label class="ui-label" for="Series">NSE series</label><select id="Series" class="ui-select" formControlName="Series"><option *ngFor="let series of ['EQ','BE','GS','SM','BZ','ST','NF','NO','NS','NH','NV','NX']" [value]="series">{{series}}</option></select><p class="helper-text">EQ: ordinary equity shares.</p></div><div><label class="ui-label" for="FilterType">Trend method</label><select id="FilterType" class="ui-select" formControlName="FilterType"><option value="Continuous">Continuous trend</option><option value="MovingAverage">Moving average</option></select></div></div>
<h3 class="criteria-heading">Filter criteria</h3><p class="helper-text">Matches need enough available history. Start with a short period.</p>
<div formArrayName="criterias"><div *ngFor="let input of criterias.controls; let i = index" [formGroupName]="i" class="criteria-row">
<div><label class="ui-label" [for]="'field-'+i">Field</label><select [id]="'field-'+i" class="ui-select" formControlName="fieldName"><option value="PreviousClose">Previous close</option><option value="OpenPrice">Open price</option><option value="HighPrice">High price</option><option value="LowPrice">Low price</option><option value="LastPrice">Last price</option><option value="ClosePrice">Close price</option><option value="AvgPrice">Average price</option><option value="TtlTrdQnty">Traded volume</option><option value="TurnOverLacs">Turnover (lakh INR)</option><option value="NoOfTrades">Trade count</option><option value="DeliveryQty">Deliverable quantity</option><option value="DeliveryPercentage">Delivery percentage</option></select></div>
<div><label class="ui-label" [for]="'period-'+i">Length</label><input [id]="'period-'+i" class="ui-input" type="number" min="1" step="1" formControlName="periodValue"></div>
<div><label class="ui-label" [for]="'unit-'+i">Period</label><select [id]="'unit-'+i" class="ui-select" formControlName="periodType"><option value="Days">Days</option><option value="Weeks">Weeks</option><option value="Months">Months</option><option value="Years">Years</option></select></div>
<div><label class="ui-label" [for]="'change-'+i">Direction</label><select [id]="'change-'+i" class="ui-select" formControlName="changeType"><option value="Increase">Increasing</option><option value="Decrease">Decreasing</option></select></div>
<div><label class="ui-label" [for]="'join-'+i">Join next</label><select [id]="'join-'+i" class="ui-select" formControlName="logicalOperator"><option value="And">AND</option><option value="Or">OR</option></select></div>
<button type="button" class="dialog-close" [attr.aria-label]="'Remove criterion '+(i+1)" [disabled]="criterias.length <= 1 || isLoading" (click)="removeRow(i)">&times;</button></div></div>
<button type="button" class="ui-button ui-button-quiet" (click)="addRow()" [disabled]="isLoading">+ Add criterion</button><footer class="dialog-actions"><button type="button" class="ui-button ui-button-quiet" (click)="closeModal()" [disabled]="isLoading">Cancel</button><button type="submit" class="ui-button" [disabled]="isLoading">{{isLoading ? 'Saving filter...' : 'Save filter'}}</button></footer></form></section></div>
