<button type="button" class="notes-launcher" (click)="toggleState()" aria-controls="research-notes" [attr.aria-expanded]="openChatBox"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M6 3h10l3 3v15H6V3Zm4 5h5M10 12h5M10 16h5M3 7h3M3 11h3M3 15h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Research notes<span *ngIf="dirty" class="draft-dot" aria-label="Unsaved draft"></span></button>
<div *ngIf="openChatBox" class="notes-layer" (keydown.escape)="toggleState()"><div class="notes-scrim"></div><aside id="research-notes" role="dialog" aria-modal="true" aria-labelledby="notes-title" class="notes-drawer" cdkTrapFocus [cdkTrapFocusAutoCapture]="true"><header><div><p class="eyebrow">Keep your observations together</p><h2 id="notes-title">Research notes</h2></div><button type="button" class="dialog-close" aria-label="Close research notes" (click)="toggleState()">&times;</button></header><p class="shared-notice"><strong>Shared notebook</strong> &middot; Notes are visible to other users of this app. Avoid personal or sensitive information.</p><div class="notes-content"><p *ngIf="loading" role="status">Loading saved notes...</p><div *ngIf="loadError" role="alert" class="form-error">Notes could not be loaded.<button type="button" class="ui-button ui-button-link" (click)="getAllNotebooks()">Try again</button></div><div *ngFor="let note of notebooks; let i = index" class="note-entry"><label [for]="'note-'+i">{{formatDate(note.contentDate)}}</label><textarea [id]="'note-'+i" rows="9" [(ngModel)]="note.content" (ngModelChange)="dirty = true; message = ''" placeholder="What stood out in your research?"></textarea></div></div><footer><p #noteFeedback tabindex="-1" *ngIf="message" role="status" class="note-feedback">{{message}}</p><span *ngIf="!message" class="helper-text">{{dirty ? 'Unsaved changes' : 'Your research, organized by date.'}}</span><button type="button" class="ui-button" [disabled]="!loaded || saving || !dirty" (click)="updateNoteBooks()">{{saving ? 'Saving...' : 'Save notes'}}</button></footer></aside></div>
